<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hardline</title>
<style>
:root{--bg:#0e1419;--panel:#161e25;--fg:#e9e6dd;--mut:#7f8d97;--ac:#ff6a2b;--line:#2a3640}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;overflow:hidden}
canvas{display:block}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 30%,#1c2831,var(--bg) 70%);z-index:5}
h1{font-size:clamp(56px,11vw,120px);margin:0;letter-spacing:.06em;font-weight:800;line-height:.9}
.pane{display:flex;flex-direction:column;gap:10px;width:min(340px,86vw)}
.pane[hidden]{display:none}
button,input,select{font:inherit;font-size:22px;padding:11px 14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:4px;width:100%}
button{cursor:pointer;font-weight:700;letter-spacing:.04em}
button.go{background:var(--ac);border-color:var(--ac);color:#140a04}
button:hover{filter:brightness(1.12)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.ghost{background:none;color:var(--mut)}
#msg{color:#ff8a5c;min-height:24px;margin:0;font-size:20px}
#list{display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto}
#list button{font-size:18px;text-align:left;display:flex;justify-content:space-between}
.sw{display:flex;gap:10px}.sw button{height:64px;padding:0}.sw button.on{outline:3px solid var(--fg)}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:2}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border:2px solid #fff;border-radius:50%;opacity:.8}
#hp{position:absolute;left:20px;bottom:20px;width:220px;height:16px;border:1px solid #fff8;background:#0008}
#hpf{height:100%;width:100%;background:var(--ac);transition:width .15s}
#sb{position:absolute;right:16px;top:16px;font-size:20px;text-align:right;line-height:1.3;text-shadow:0 1px 3px #000}
#feed{position:absolute;left:16px;top:16px;font-size:20px;text-shadow:0 1px 3px #000}
#hint{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-size:26px;text-shadow:0 1px 4px #000}
#flash{position:fixed;inset:0;background:#f22;opacity:0;transition:opacity .25s;pointer-events:none;z-index:3}
canvas{touch-action:none}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#menu{overflow:auto}
#joy,#fire,#jump{position:absolute;display:none;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid #fff8;background:#0005}
.touch #joy,.touch #fire,.touch #jump{display:block}
#joy{left:28px;bottom:40px;width:130px;height:130px}
#knob{position:absolute;left:45px;top:45px;width:40px;height:40px;border-radius:50%;background:#fffa;pointer-events:none}
#fire{right:30px;bottom:56px;width:96px;height:96px;background:#ff6a2bcc}
#jump{right:146px;bottom:30px;width:64px;height:64px}
.touch #hp{bottom:auto;top:14px;left:50%;transform:translateX(-50%);width:160px}
.touch #sb{font-size:16px}.touch #feed{font-size:16px}
@media (max-height:520px){#menu{justify-content:flex-start;padding:10px 0;gap:8px}h1{font-size:40px}button,input,select{font-size:17px;padding:7px 10px}.pane{gap:6px}#list{max-height:80px}}
</style></head><body>

<div id="menu">
  <h1>HARDLINE</h1>
  <div class="pane" id="p-main">
    <input id="nick" placeholder="Your name" maxlength="16" value="">
    <button class="go" data-go="play">Play</button>
    <button data-go="shop">Shop</button>
  </div>
  <div class="pane" id="p-play" hidden>
    <button class="go" data-go="create">Create Server</button>
    <button data-go="join">Join Server</button>
    <button class="ghost" data-go="main">Back</button>
  </div>
  <div class="pane" id="p-create" hidden>
    <input id="c-name" placeholder="Server name" maxlength="20">
    <input id="c-pass" placeholder="Password" maxlength="20">
    <select id="c-cap"><option value="2">2 players (1v1)</option><option value="4">4 players</option><option value="8">8 players</option></select>
    <select id="c-map"></select>
    <button class="go" id="do-create">Create Server</button>
    <button class="ghost" data-go="play">Back</button>
  </div>
  <div class="pane" id="p-join" hidden>
    <div id="list"></div>
    <input id="j-name" placeholder="Server name" maxlength="20">
    <input id="j-pass" placeholder="Password" maxlength="20">
    <button class="go" id="do-join">Join Server</button>
    <button class="ghost" data-go="play">Back</button>
  </div>
  <div class="pane" id="p-shop" hidden>
    <div class="sw" id="sw"></div>
    <button class="ghost" data-go="main">Back</button>
  </div>
  <p id="msg"></p>
</div>

<div id="hud"><div id="cross"></div><div id="hp"><div id="hpf"></div></div><div id="sb"></div><div id="feed"></div><div id="hint">Click to play · WASD move · Space jump · Mouse aim & shoot</div><div id="joy"><div id="knob"></div></div><div id="jump"></div><div id="fire"></div></div>
<div id="flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/game.js"></script>
</body></html>
